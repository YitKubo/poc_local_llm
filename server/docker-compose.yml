name: local-llm

# llama.cpp is NOT published to the host: LiteLLM is the only entrance.
# Only LiteLLM (:4000) is reachable from clients. For sizing measurements that must
# hit llama.cpp directly, overlay docker-compose.debug.yml (loopback only).

services:
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server
    # NOTE: pass "--flag value" as separate items. llama.cpp rejects "--flag=value" and
    # rewrites "_" to "-" in what it treats as one argument (it mangled Q4_K_M in the path).
    command:
      - --model
      - /models/${MODEL_FILE}
      - --alias
      - ${MODEL_ALIAS}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      # Continuous batching is enabled by default; --parallel sets the slot count.
      - --parallel
      - "${LLAMA_PARALLEL}"
      # With an explicit --parallel, unified KV is NOT the default (only for auto slots),
      # so ask for it: -c becomes one pool shared by all slots instead of being divided.
      - --kv-unified
      - --ctx-size
      - "${LLAMA_CTX}"
      - --threads
      - "${LLAMA_THREADS}"
      - --metrics
    environment:
      LLAMA_API_KEY: ${LLAMA_API_KEY}
    volumes:
      - ./models:/models:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: litellm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD}@postgres:5432/litellm
      LLAMA_API_KEY: ${LLAMA_API_KEY}
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      llama:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
